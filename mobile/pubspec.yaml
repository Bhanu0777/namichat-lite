name: namichat_lite
description: NamiChat Lite — a lightweight realtime chat application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Local persistence ---
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.1
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  equatable: ^2.0.5
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.4
  go_router: ^14.2.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  internet_connection_checker_plus: ^2.6.0
  json_annotation: ^4.9.0
  logger: ^2.5.0
  pretty_dio_logger: ^1.4.0
  riverpod_annotation: ^2.3.5
  uuid: ^4.5.1
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Code generation toolchain (Freezed / JSON / Riverpod / Hive) ---
  build_runner: ^2.4.13             # drives code generation
  freezed: ^2.4.4                   # immutable union/data classes
  json_serializable: ^6.8.0         # JSON (de)serialization
  riverpod_generator: ^2.4.0        # Riverpod @riverpod codegen
  hive_generator: ^2.0.1            # Hive TypeAdapter codegen

  # --- Testing ---
  mockito: ^5.4.4                   # mock generation for unit tests
  fake_async: ^1.3.1                # control timers in tests

flutter:
  uses-material-design: true
